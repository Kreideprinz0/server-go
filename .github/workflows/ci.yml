name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. ТЕСТЫ + POSTGRES
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run migrations
        env:
          PGPASSWORD: app_password
        run: |
          psql -h localhost -U app_user -d app_db -c "
          CREATE TABLE IF NOT EXISTS items (
            id SERIAL PRIMARY KEY,
            name TEXT NOT NULL,
            price INTEGER NOT NULL
          );"

      - name: Run tests
        env:
          DATABASE_URL: "postgres://app_user:app_password@localhost:5432/app_db?sslmode=disable"
        run: |
          go mod download
          go vet ./...
          go test -race -v -p 1 ./...

  # 2. СБОРКА И SMOKE-ТЕСТ
  build-and-smoke:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t server-go:test .

      - name: Run Docker Compose
        env:
          DATABASE_URL: "postgres://app_user:app_password@db:5432/app_db?sslmode=disable"
        run: |
          docker compose up -d
          
          for i in $(seq 1 20); do 
            curl -sf localhost:8080/items >/dev/null && break 
            sleep 1
          done
          
          curl -sf localhost:8080/items >/dev/null || (docker compose logs app; exit 1)

      - name: Smoke test API
        run: |
          test "$(curl -s localhost:8080/items)" = "[]"
          curl -sf -X POST localhost:8080/items -H 'Content-Type: application/json' -d '{"name":"apple","price":100}' | jq -e '.id == 1 and .name == "apple"'
          curl -sf localhost:8080/items/1 | jq -e '.name == "apple"'
          curl -sf -X PUT localhost:8080/items/1 -H 'Content-Type: application/json' -d '{"name":"banana","price":200}' | jq -e '.name == "banana"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE localhost:8080/items/1)" = "204"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/items/1)" = "404"
      
      - name: Stop containers
        if: always()
        run: docker compose down -v